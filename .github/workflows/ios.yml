name: iOS build (TestFlight)

# Builds the native shell in native/ and uploads it to TestFlight. Runs only
# once the Apple side exists: set the repository variable IOS_SIGNING_READY to
# "true" and the secrets named in native/README.md.
on:
  push:
    branches: [native, main]
    paths: ['native/**', '.github/workflows/ios.yml']
  # Nightly (Will, 21 Oct 2026: "set up nightly and daily builds"). 03:07 UTC,
  # after the web nightly build has landed on main. The gate job below skips
  # the Mac unless the phone code changed in the last day, so a quiet night
  # costs a few seconds of Linux, not a Mac build. Mondays always build, so a
  # TestFlight build never reaches Apple's 90-day expiry.
  schedule:
    - cron: '7 3 * * *'
  workflow_dispatch:

jobs:
  gate:
    if: ${{ vars.IOS_SIGNING_READY == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 100 }
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$(date -u +%u)" = "1" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; echo "Monday: weekly build keeps TestFlight fresh"; exit 0; fi
          if [ -n "$(git log --since='25 hours ago' --format=%H -- native .github/workflows/ios.yml)" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "Nothing new in native/ since yesterday: no build tonight"
          fi

  build:
    needs: gate
    if: ${{ needs.gate.outputs.go == 'true' }}
    runs-on: macos-15
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx cap sync ios
      - run: ruby add-widget.rb
      - run: pod install
        working-directory: native/ios/App
      - name: Signing
        env:
          IOS_CERT_P12: ${{ secrets.IOS_CERT_P12 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          echo "$IOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
      # Automatic signing with the App Store Connect key makes the two App
      # Store profiles itself. The team has to be named here because the
      # Xcode project does not carry one (it is the owner's, not the repo's),
      # and the archive is signed with the Distribution certificate from the
      # keychain above rather than a Development one the runner does not have.
      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive -allowProvisioningUpdates \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Distribution" \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            archive
      - name: Export and upload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/out \
            -exportOptionsPlist export.plist -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}
