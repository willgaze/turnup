# BACKUP for the nudge sweep. The schedule that matters is Vercel Cron, in
# vercel.json, every five minutes (since v1.56.0, 18 Oct 2026).
#
# WHY IT MOVED. GitHub's scheduler is best effort, and for this repository it
# was far worse than "a few minutes late": 37 runs in total by 17 Oct, and on
# that day at 00:57, 05:29, 09:37, 13:12 and 16:29 — four hours apart, not
# five minutes. Every nudge rides on this sweep (the missed-window notice, the
# 4pm day-before ask, the review ask two hours after Job done, Follow every
# booking), so all of them were hours late. The team is on Vercel Pro, which
# runs a five-minute cron; the old worry here was the free plan's once-a-day
# cap, and a Hobby team would have failed the preview deploy, which it did not.
#
# Why keep this at all: two schedulers fail differently, and the sweep is
# idempotent and throttled to one run per twenty seconds inside the route, so
# a second caller can never produce a second notification.
#
# COST: nil while willgaze/turnup is public (Actions minutes are free and
# unlimited on public repositories). If the repo is ever made private, delete
# this workflow: Vercel Cron does the job on its own.
#
# If this job ever goes red, check Vercel's Cron Jobs tab before anything else.
name: Nudge sweep

on:
  schedule:
    - cron: '*/15 * * * *'
  # So it can be run by hand from the Actions tab to check it still works.
  workflow_dispatch:

# Two runs overlapping would do no harm — the sweep is idempotent — but there
# is no reason to pay for it.
concurrency:
  group: nudge-sweep
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask TurnUp to send any nudge that is due
        env:
          # Optional. Unset, the endpoint is open and this header is ignored.
          # Set it here as a repository secret AND as CRON_SECRET in Vercel to
          # close it; setting it in only one place locks the schedule out.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          body=$(curl -sS --max-time 30 --retry 2 --retry-delay 5 \
            ${CRON_SECRET:+-H "Authorization: Bearer $CRON_SECRET"} \
            -w '\n%{http_code}' \
            https://www.getturnup.com/api/cron/nudge)
          code=$(printf '%s' "$body" | tail -n1)
          printf '%s\n' "$body" | sed '$d'
          if [ "$code" != "200" ]; then
            echo "::error::Nudge sweep answered $code — nudges are not being sent."
            exit 1
          fi
