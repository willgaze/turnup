# The BACKUP ping for the nudge sweep. Vercel Cron is the real schedule since
# v1.56.0 (vercel.json, every five minutes); this is here so a sweep still
# happens if that ever stops.
#
# WHY IT MOVED. This workflow asked for every five minutes and GitHub ran it
# about every four hours: 37 runs in its whole life, and on 17 Oct at 00:57,
# 05:29, 09:37, 13:12 and 16:29. GitHub's scheduler is best effort and drops
# scheduled runs under load, so the missed-window notice, the 4pm day-before
# ask, the review ask and Follow every booking were all firing hours late. The
# reason it lived here at all was Vercel's free plan, which caps cron at once a
# day; the team is on Pro (Vercel's 9 Oct email), which runs five-minute cron.
#
# Two callers cannot double a notification: every nudge level fires once and a
# repeat is paced inside nudgeAll(), whoever calls it, and a sweep within
# twenty seconds of the last one answers "too soon".
#
# COST: nil while willgaze/turnup is public. GitHub bills a minimum of one
# minute per job, so on a private repo this backup costs money: drop it then.
#
# GitHub disables scheduled workflows on a repository with no commits for 60
# days. If this job goes red, the sweep answered badly: look at Vercel too.
name: Nudge sweep

on:
  schedule:
    - cron: '*/30 * * * *'
  # So it can be run by hand from the Actions tab to check it still works.
  workflow_dispatch:

# Two runs overlapping would do no harm — the sweep is idempotent — but there
# is no reason to pay for it.
concurrency:
  group: nudge-sweep
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask TurnUp to send any nudge that is due
        env:
          # Optional. Unset, the endpoint is open and this header is ignored.
          # Set it here as a repository secret AND as CRON_SECRET in Vercel to
          # close it; setting it in only one place locks the schedule out.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          body=$(curl -sS --max-time 30 --retry 2 --retry-delay 5 \
            ${CRON_SECRET:+-H "Authorization: Bearer $CRON_SECRET"} \
            -w '\n%{http_code}' \
            https://www.getturnup.com/api/cron/nudge)
          code=$(printf '%s' "$body" | tail -n1)
          printf '%s\n' "$body" | sed '$d'
          if [ "$code" != "200" ]; then
            echo "::error::Nudge sweep answered $code — nudges are not being sent."
            exit 1
          fi
